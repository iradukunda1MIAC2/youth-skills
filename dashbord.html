<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIAC Dashboard</title>
    <link rel="stylesheet" href="dashbord.css">
</head>
<body>

    <header>
        <h1>MIAC YouthSkills</h1>
        <button id="logoutBtn">Logout</button>
    </header>

    <section class="welcome">
        <h2>Welcome Student</h2>
        <p>Select a course and start learning.</p>
    </section>

    <section class="courses">

        <div class="course-card">
            <h3>Web Development</h3>
            <p>Learn HTML, CSS and JavaScript.</p>
            <button>Start Course</button>
        </div>

        <div class="course-card">
            <h3>Graphic Design</h3>
            <p>Learn Canva, Photoshop and Branding.</p>
            <button>Start Course</button>
        </div>

        <div class="course-card">
            <h3>Entrepreneurship</h3>
            <p>Learn business planning and innovation.</p>
            <button>Start Course</button>
        </div>

        <div class="course-card">
            <h3>Digital Marketing</h3>
            <p>Learn social media and online marketing.</p>
            <button>Start Course</button>
        </div>

    </section>

    <script src="dashbord.js"></script>

</body>
</html>
